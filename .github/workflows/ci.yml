name: Application checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci --prefix client --no-fund
      - run: npm run build --prefix client
      - run: npm test --prefix client
      - run: dotnet test tests/Fireside.Tests.csproj --nologo
      - run: dotnet publish server/Fireside.csproj -c Release -p:SkipClientBuild=true -o server/bin/publish
